# dxvk.conf for the bridge server. It goes in Bin next to d3d9.dll, not in .trex; the client points the server's DXVK at it
# (DXVK_CONFIG_FILE, patch 0016), so the folder the game was started from does not matter.
# DXVK's built-in TS3W profile matches the exe name, and the server is NvRemixBridge.exe, so the profile's ids are repeated
# here. Without them the game sees a new GPU id and resets Options.ini to defaults. The profile's name ("Geforce GTX 580")
# is left out: the game finds device 1080 in GraphicsCards.sgr and tiers by that entry, so the driver name it logs is the
# player's real card.
d3d9.customVendorId = 10de
d3d9.customDeviceId = 1080
# a Reset (windowed to fullscreen, a new resolution) failed in the server with "device still has alive losable resources:
# Remaining resources: 1", and the game called Reset again every frame (2026-11-09). DXVK resets anyway with this off;
# its resources are not lost on a Reset, so the one left alive stays valid. UNVERIFIED which object it is
d3d9.countLosableResources = False
