# dxvk.conf for the bridge server. It goes in Bin (the server's working folder), not in .trex.
# DXVK's built-in TS3W profile matches the exe name, and the server is NvRemixBridge.exe, so the profile is repeated here.
# Without it the game sees a new GPU id and resets Options.ini to defaults.
d3d9.customVendorId = 10de
d3d9.customDeviceId = 1080
d3d9.customDeviceDesc = "Geforce GTX 580"
# a Reset (windowed to fullscreen, a new resolution) failed in the server with "device still has alive losable resources:
# Remaining resources: 1", and the game called Reset again every frame (2026-11-09). DXVK resets anyway with this off;
# its resources are not lost on a Reset, so the one left alive stays valid. UNVERIFIED which object it is
d3d9.countLosableResources = False
